# CI: everything that must be true before `bash scripts/deploy_all.sh` is safe to run.
#
#   secrets ─┐
#   go ──────┤
#   harness ─┼─► deploy-ready   (single required check for branch protection)
#   workflows┤
#   web ─────┤
#   scripts ─┘
#
# Tests run against REAL Postgres (a service container), same as locally — COPY, ON CONFLICT,
# advisory locks and enum casts are exactly where fakes lie.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:              # a newer push to the same branch cancels the stale run
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/loan_engine_test

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}            # scan every commit, not just the tip
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 \
            git /repo --config /repo/.gitleaks.toml --redact --no-banner

  go:
    name: Go backend (fmt, vet, test, Lambda build)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: postgres, POSTGRES_DB: loan_engine_test}
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - name: gofmt
        run: |
          unformatted=$(gofmt -l apps packages internal)
          [ -z "$unformatted" ] || { echo "run gofmt -w on:"; echo "$unformatted"; exit 1; }
      - run: go vet ./...
      - name: go test (race detector, real Postgres)
        run: go test -race -count=1 ./...
      - name: Build Lambda artifacts (linux/arm64)
        run: bash scripts/build_lambdas.sh
      - uses: actions/upload-artifact@v4
        with:
          name: lambda-zips
          path: build/lambda/*.zip
          retention-days: 7

  harness:
    name: Python harness (n8n SQL + JS vs Go, brute-force oracle)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: postgres, POSTGRES_DB: loan_engine_test}
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install "psycopg[binary]>=3.2,<3.3" "pytest>=8" "ruff>=0.6"
      - name: ruff (lint)
        run: ruff check .
      - name: pytest
        run: pytest

  workflows:
    name: n8n workflows (unit tests, dist/ up to date)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Code-node modules
        run: node --test apps/workflows/tests/*.test.js
      - name: dist/*.json matches the sources (what n8n imports)
        run: |
          python apps/workflows/build.py
          git diff --exit-code -- apps/workflows/dist \
            || { echo "dist/ is stale: run python apps/workflows/build.py and commit"; exit 1; }

  web:
    name: Web console (test, typecheck, static build)
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: apps/web}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - name: next build (static export, as deployed to S3 / Amplify)
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://example.invalid/dev
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Export contains every route
        run: for p in index upload/index history/index catalogue/index batch/index 404; do test -f "out/$p.html"; done

  scripts:
    name: Deploy scripts (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          docker run --rm -v "$PWD:/r:ro" -w /r koalaman/shellcheck:v0.10.0 \
            scripts/*.sh apps/workflows/docker/init.sh

  deploy-ready:
    name: Deploy ready
    needs: [secrets, go, harness, workflows, web, scripts]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All pre-deployment checks passed. Deploy with -> bash scripts/deploy_all.sh"
